<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bússola dos Planos</title>
<meta name="description" content="Compare suas ideias com os planos de governo de Lula (PT) e Flávio Bolsonaro (PL) registrados no TSE para o 2º turno de 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de leitura (máx. 680px), uma pergunta por vez, resultado em duas barras comparativas. Sem cores partidárias: os dois planos usam azul-petróleo e âmbar. */
:root{
  --bg:#f2f3ef; --surface:#fbfbf8; --ink:#1b2320; --muted:#59655f; --line:#d6dad3;
  --accent:#24473f; --on-accent:#ffffff; --pa:#0b7a86; --pb:#b4690e; --soft:#e7ebe5;
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#171f1c; --ink:#e8ece9; --muted:#9aa7a1; --line:#2b3631;
  --accent:#8cc7b6; --on-accent:#0f1513; --pa:#4fc3d0; --pb:#f0b45a; --soft:#202b27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#171f1c; --ink:#e8ece9; --muted:#9aa7a1; --line:#2b3631;
  --accent:#8cc7b6; --on-accent:#0f1513; --pa:#4fc3d0; --pb:#f0b45a; --soft:#202b27; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 56px}
*{box-sizing:border-box}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:24px;min-width:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(2rem,7vw,3rem);letter-spacing:-.02em}
h2{font-size:1.5rem}
h3{font-size:1.05rem}
p{margin:0}
/* textos corridos justificados; hifenização (lang=pt-BR) evita buracos entre palavras em telas estreitas */
p,.opt span,.ans .q>span:not(.qt){text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.08rem;color:var(--ink);max-width:56ch}
.note{font-size:.88rem;color:var(--muted);max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible,.opt:focus-within,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mode b{font-family:var(--f-display);font-size:1.3rem}
.mode span{color:var(--muted);font-size:.92rem}
.mode .go{margin-top:8px;font-weight:600;color:var(--accent)}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.home{all:unset;cursor:pointer;align-self:flex-start;font-size:.9rem;font-weight:600;color:var(--accent);margin-bottom:-8px}
.home:hover{text-decoration:underline}
.home:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:12px}
legend{padding:0;margin-bottom:14px;font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,4.5vw,1.65rem);line-height:1.2;text-wrap:balance}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:14px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt.skip{border-style:dashed;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:6px;padding:11px 18px;border:1.5px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.star{display:flex;gap:8px;align-items:center;font-size:.92rem;color:var(--muted);cursor:pointer}
.star input{accent-color:var(--accent);width:16px;height:16px}
.verdict{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:18px}
.score{display:flex;flex-direction:column;gap:6px}
.score .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .nm{font-weight:600}
.score .pc{font-family:var(--f-display);font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.track{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.track>i{display:block;height:100%}
.ca{background:var(--pa)} .cb{background:var(--pb)}
.themes{display:flex;flex-direction:column;gap:14px}
.th{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:4px 16px;align-items:center}
.th .lab{grid-column:1/-1;font-weight:600;font-size:.95rem}
.th .mini{display:flex;align-items:center;gap:8px;min-width:0}
.th .mini .track{flex:1;height:8px}
.th .mini em{font-style:normal;font-family:var(--f-mono);font-size:.75rem;width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style-position:inside}
.ans{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.ans .q{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:12px}
.ans .q:first-child{border-top:0;padding-top:0}
.qt{font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;margin-right:6px;color:#fff;vertical-align:1px}
.chip.L{background:var(--pa)} .chip.F{background:var(--pb)} .chip.B{background:var(--accent);color:var(--on-accent)} .chip.N{background:var(--muted)}
:root[data-theme="dark"] .chip.L,:root[data-theme="dark"] .chip.F{color:#0f1513}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.L,:root:not([data-theme="light"]) .chip.F{color:#0f1513}}
.src{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}
a.src{text-decoration:underline;text-underline-offset:2px}
.alt{font-size:.9rem;color:var(--muted)}
.caveat{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px;font-size:.92rem;color:var(--muted)}
.caveat a{color:var(--accent)}
.about{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:22px;max-width:60ch}
.about h2{font-size:1.2rem}
.about p{color:var(--ink)}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.foot a{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
@media (max-width:420px){.th{grid-template-columns:1fr}}
</style>
</head>

(function(){
var TH={seg:'Segurança pública',eco:'Economia e impostos',trab:'Trabalho e renda',prev:'Previdência e INSS',est:'Estado e instituições',sau:'Saúde',edu:'Educação',amb:'Meio ambiente e energia',cam:'Campo e alimentação',soc:'Proteção social e moradia',mul:'Mulheres',dir:'Direitos e valores',reg:'Regiões e infraestrutura',ext:'Política externa e defesa',dig:'Tecnologia e governo digital',cul:'Cultura e esporte'};
var NAME={L:'Lula (PT)',F:'Flávio Bolsonaro (PL)'};
var PDF={L:'https://www.tse.jus.br/eleicoes/eleicoes-2026-content/arquivos/proposta-pt/@@display-file/file/proposta-pt.pdf',F:'https://www.tse.jus.br/eleicoes/eleicoes-2026-content/arquivos/proposta-pl/@@display-file/file/proposta-pl.pdf'};

var Q=[
{id:'seg1',th:'seg',quick:1,q:'Como o governo federal deve enfrentar PCC, CV e milícias?',o:[
 {w:'F',t:'Declarar as facções "organizações narcoterroristas", combatê-las com força (o plano prevê abater quem estiver armado de fuzil) e bloquear seus ativos.',s:'Brasil sem Medo, p.13'},
 {w:'L',t:'Asfixiar financeiramente o crime organizado, aplicar a Lei Antifacção e integrar a inteligência com estados e municípios, nos marcos do Estado de Direito.',s:'Diretriz 3, p.27–28'}]},
{id:'seg2',th:'seg',quick:1,q:'O que fazer com a idade de responsabilização penal de jovens?',o:[

 {w:'L',t:'Não mexer na idade penal e investir em prevenção da violência juvenil, mediação comunitária e justiça restaurativa.',s:'Diretriz 3, p.29 (o plano não propõe mudar a maioridade)'}]},
{id:'seg3',th:'seg',q:'Qual caminho para o sistema prisional?',o:[

{id:'seg4',th:'seg',q:'Como tratar penas e execução penal?',o:[

 {w:'L',t:'Criar procedimentos jurídicos mais ágeis para punir o crime organizado e barrar candidaturas ligadas a ele, sem propor essas penas.',s:'Diretriz 3, p.27 (o plano não propõe essas penas)'}]},
{id:'seg5',th:'seg',q:'Qual tecnologia priorizar na segurança?',o:[
 {w:'F',t:'Um sistema nacional de reconhecimento facial integrado a bancos de dados criminais e mais de 1 milhão de novas câmeras.',s:'Brasil sem Medo, p.15'},
 {w:'L',t:'Inteligência integrada (SINESP/Infoseg), câmeras corporais nos policiais com padrão nacional e controle interno e externo da atividade policial.',s:'Diretriz 3, p.28 e 30'}]},
{id:'seg6',th:'seg',q:'Como organizar a presença federal na segurança?',o:[

 {w:'L',t:'Aprovar a PEC da Segurança, criar o Ministério da Segurança Pública e ampliar as forças integradas (FICCOs) com estados e municípios.',s:'Diretriz 3, p.27–30'}]},
{id:'seg7',th:'seg',q:'Como usar o dinheiro federal da segurança?',o:[

{id:'seg8',th:'seg',q:'Como combater o roubo de celulares?',o:[

{id:'eco1',th:'eco',quick:1,q:'Qual regra para as contas públicas?',o:[

 {w:'F',t:'Trocar as regras fiscais por outras focadas em reduzir a dívida, com superávits e limite de gastos para os três Poderes.',s:'Brasil que Não Volta Atrás, p.71'}]},
{id:'eco2',th:'eco',quick:1,q:'O que fazer com a reforma tributária do consumo?',o:[

 {w:'F',t:'Rever e redimensionar a reforma: reduzir o IVA projetado, cortar exceções e diminuir a carga sobre produção e consumo.',s:'Brasil Mais Barato, p.30; Brasil que Não Volta Atrás, p.71–72'}]},
{id:'eco3',th:'eco',q:'Qual deve ser o foco da política de impostos?',o:[
 {w:'L',t:'Justiça tributária: manter a isenção de IR até R$ 5 mil e a tributação dos super-ricos já aprovadas e seguir cortando privilégios e distorções.',s:'Compromisso com o Projeto de Nação, p.11; Diretriz 2, p.19; Diretriz 8, p.49'},
 {w:'F',t:'Cortar impostos sobre consumo, produção, energia elétrica e combustíveis e reduzir exceções, para que grupos parecidos paguem impostos parecidos.',s:'Brasil Mais Barato, p.30–31'}]},
{id:'eco4',th:'eco',quick:1,q:'Qual o papel do Estado na economia?',o:[
 {w:'L',t:'Política industrial ativa (Nova Indústria Brasil), com financiamento direcionado, compras públicas e conteúdo local.',s:'Diretriz 8, p.50–51'},
 {w:'F',t:'O Estado não deve ser empresário: desestatizações avaliadas caso a caso, concessões e PPPs, e BNDES só para obras no Brasil.',s:'Brasil que Cresce, p.49–51; Brasil que Não Volta Atrás, p.70'}]},
{id:'eco5',th:'eco',q:'Como ajudar famílias endividadas?',o:[

 {w:'F',t:'Baixar os juros reduzindo a dívida pública, dar orientação financeira pela CAIXA e criar o Ganha-Ganha (quem paga em dia ganha juros menores).',s:'Brasil Mais Barato, p.32–33; Brasil que Prospera, p.46'}]},
{id:'tr1',th:'trab',quick:1,q:'Como definir a jornada de trabalho?',o:[
 {w:'L',t:'Acabar com a escala 6x1 e reduzir a jornada para 40 horas semanais, sem redução de salário.',s:'Diretriz 12, p.75'},
 {w:'F',t:'Fazer valer o negociado sobre o legislado: trabalhador e empresa combinam jornada e condições, dentro da lei.',s:'Brasil que Prospera, p.44–45'}]},
{id:'tr2',th:'trab',q:'Como tratar o trabalho por aplicativos?',o:[
 {w:'L',t:'Criar regras para o trabalho por aplicativos, definindo relação de trabalho, remuneração, direitos e contribuição à previdência.',s:'Diretriz 12, p.74–75 e 77'},

 {w:'F',t:'Reduzir aos poucos o custo do emprego formal, sem tirar direitos, com contratos mais baratos para o primeiro emprego e para quem tem 50 anos ou mais.',s:'Brasil que Prospera, p.43–44'}]},
{id:'tr4',th:'trab',q:'Qual o papel dos sindicatos?',o:[

var app=document.getElementById('app');

function rnd(s){s=(s*9301+49297)%233280;return s/233280}
function shuffle(a,seed){a=a.slice();var s=seed;for(var i=a.length-1;i>0;i--){s=Math.floor(rnd(s+i)*1e6);var j=s%(i+1);var t=a[i];a[i]=a[j];a[j]=t}return a}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
/* fonte com link para a primeira página citada no PDF do plano correspondente */
function src(w,s){var m=/p\.(\d+)/.exec(s);if(!PDF[w]||!m)return '<span class="src">'+esc(s)+'</span>';
  return '<a class="src" href="'+PDF[w]+'#page='+m[1]+'" target="_blank" rel="noopener">'+esc(s)+'</a>'}
function who(w){return w==='L'?'Lula':w==='F'?'Flávio':'Os dois'}
function intro(){

   '<button class="mode" data-m="full"><b>Completo</b><span>'+Q.length+' perguntas · cerca de 20 a 25 minutos. Você marca o que mais importa para você.</span><span class="go">Começar</span></button>'+
  '</div>'+
  '<p class="note">Os dois planos comparados são os de Lula (PT) e de Flávio Bolsonaro (PL), disponíveis na página de planos de governo do TSE. Suas respostas não saem do seu navegador.</p>'+
  '<section class="about" aria-labelledby="about-h"><h2 id="about-h">Por que este site existe</h2>'+
   '<p>Muita discussão política fica no nome do candidato e pouco no que ele propõe. Os planos de governo registrados no TSE dizem por escrito o que cada lado pretende fazer, mas juntos passam de 150 páginas, e quase ninguém tem tempo de ler.</p>'+
   '<p>Aqui você conhece esses planos tema por tema, sem saber de quem é cada proposta até o final. A ideia é ajudar você a decidir de forma coerente com o que pensa sobre cada assunto, e não pelo rótulo.</p>'+

}
function start(m){
  st.mode=m;st.list=Q.filter(function(q){return m==='full'||q.quick});st.i=0;st.ans={};st.imp={};st.seed=Math.floor(Math.random()*9000)+11;
  ask();window.scrollTo(0,0);
}
function ask(){
  var q=st.list[st.i],n=st.list.length,pct=Math.round(st.i/n*100);
  var opts=shuffle(q.o,st.seed+st.i*7);
  if(q.o.length>1)opts=opts.concat([{w:'N',t:'Nenhuma delas me representa ou prefiro pular.'}]);
  else opts=opts.concat([{w:'N',t:'Prefiro pular ou não concordo.'}]);
  var cur=st.ans[q.id];
  var h='<button type="button" class="home" id="home">← Voltar ao início</button>'+
   '<div class="meta"><span>'+TH[q.th]+'</span><span>Pergunta '+(st.i+1)+' de '+n+'</span></div>'+
   '<div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
   '<form id="f"><fieldset><legend>'+esc(q.q)+'</legend>';
  opts.forEach(function(o,k){
    var idx=q.o.indexOf(o), val=(o.w==='N')?'N':String(idx);
    var chk=(cur!==undefined&&String(cur)===val)?' checked':'';
    h+='<label class="opt'+(o.w==='N'?' skip':'')+'"><input type="radio" name="a" id="o'+k+'" value="'+val+'"'+chk+'><span>'+esc(o.t)+'</span></label>';
  });
  h+='</fieldset>';
  if(st.mode==='full')h+='<label class="star" style="margin-top:14px"><input type="checkbox" id="imp"'+(st.imp[q.id]?' checked':'')+'> Este tema é muito importante para mim (vale em dobro)</label>';
  h+='<div class="row" style="margin-top:20px"><button type="button" class="btn ghost" id="back"'+(st.i===0?' disabled':'')+'>Voltar</button><button type="submit" class="btn" id="next" '+(cur===undefined?'disabled':'')+'>'+(st.i===n-1?'Ver resultado':'Próxima')+'</button></div></form>';
  app.innerHTML=h;
  var f=document.getElementById('f'),next=document.getElementById('next');
  f.onchange=function(e){var r=f.querySelector('input[name=a]:checked');if(r){st.ans[q.id]=r.value;next.disabled=false}};
  var im=document.getElementById('imp');if(im)im.onchange=function(){st.imp[q.id]=im.checked};
  document.getElementById('back').onclick=function(){if(st.i>0){st.i--;ask()}};
  document.getElementById('home').onclick=function(){
    if(Object.keys(st.ans).length&&!confirm('Voltar ao início? As respostas deste teste serão perdidas.'))return;
    intro();window.scrollTo(0,0)};
  f.onsubmit=function(e){e.preventDefault();if(st.ans[q.id]===undefined)return;if(st.i<n-1){st.i++;ask();window.scrollTo(0,0)}else{result();window.scrollTo(0,0)}};
}
function calc(){
  var T={L:0,F:0,tot:0},by={};
  st.list.forEach(function(q){
    var a=st.ans[q.id];if(a===undefined||a==='N')return;
    var o=q.o[+a],w=st.mode==='full'&&st.imp[q.id]?2:1;
    var b=by[q.th]||(by[q.th]={L:0,F:0,tot:0});
    T.tot+=w;b.tot+=w;
    if(o.w==='L'||o.w==='B'){T.L+=w;b.L+=w}
    if(o.w==='F'||o.w==='B'){T.F+=w;b.F+=w}
  });
  return {T:T,by:by};
}
function pc(x,t){return t?Math.round(x/t*100):0}

   '<p class="note">Percentual das suas respostas (com peso, no teste completo) que coincidem com propostas de cada plano. Pontos em comum contam para os dois, por isso as porcentagens não somam 100.</p></div>';

    var a=pc(b.L,b.tot),f=pc(b.F,b.tot);
    h+='<div class="th"><div class="lab">'+TH[k]+'</div>'+
     '<div class="mini"><div class="track"><i class="ca" style="width:'+a+'%"></i></div><em>'+a+'%</em></div>'+

    var qs=st.list.filter(function(q){return q.th===k});if(!qs.length)return;
    h+='<details><summary>'+TH[k]+'</summary><div class="ans">';
    qs.forEach(function(q){
      var a=st.ans[q.id];h+='<div class="q"><span class="qt">'+esc(q.q)+'</span>';
      if(a===undefined||a==='N'){h+='<span><span class="chip N">Pulou</span>Nenhuma opção escolhida.</span>'}
      else{var o=q.o[+a];
        h+='<span><span class="chip '+o.w+'">'+who(o.w)+'</span>'+esc(o.t)+'</span>'+src(o.w,o.s);

      h+='</div>';});
    h+='</div></details>';});
  h+='<h3>Onde os dois planos concordam</h3><p class="note">Propostas presentes nos dois planos. Não entram no cálculo, porque não ajudam a diferenciar um do outro.</p><details><summary>Ver os '+COMMON.length+' pontos em comum</summary><div class="ans">';
  COMMON.forEach(function(x){h+='<div class="q"><span><span class="chip B">Os dois</span>'+esc(x.t)+'</span><span>Lula: '+src('L',x.L)+'</span><span>Flávio: '+src('F',x.F)+'</span></div>'});
  h+='</div></details>';
  h+='<div class="caveat"><p>O que esta ferramenta não faz: ela compara textos de planos registrados na Justiça Eleitoral. Não mede histórico de governo, composição do Congresso, viabilidade orçamentária nem o que cada candidato diz fora do plano. Cada pergunta resume a posição escrita; confira o texto completo antes de decidir.</p>'+
   '<p>Onde o plano de um candidato não trata do tema, a opção do outro plano aparece junto com uma observação na fonte.</p>'+
   '<p>Planos no TSE: <a href="'+PDF.L+'" target="_blank" rel="noopener">plano de Lula (PDF)</a> · <a href="'+PDF.F+'" target="_blank" rel="noopener">plano de Flávio Bolsonaro (PDF)</a>. Os números de página seguem os PDFs, e cada fonte acima abre o PDF na página citada.</p></div>';
  h+='<div class="row"><button class="btn ghost" id="again">Refazer do início</button>'+(st.mode==='quick'?'<button class="btn" id="full">Fazer o teste completo</button>':'')+'</div>';
  app.innerHTML=h;
  document.getElementById('again').onclick=intro;
  var fb=document.getElementById('full');if(fb)fb.onclick=function(){start('full')};
}
intro();
})();
</script>
